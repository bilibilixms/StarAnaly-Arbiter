spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:staranaly}?serverTimezone=UTC
    username: ${MYSQL_USER:staranaly}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

staranaly:
  model:
    base-url: ${MODEL_BASE_URL:https://api.openai.com/v1}
    api-key: ${MODEL_API_KEY:}
    name: ${MODEL_NAME:}
