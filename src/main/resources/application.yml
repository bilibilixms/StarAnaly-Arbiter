spring:
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:staranaly}?serverTimezone=UTC
    username: ${MYSQL_USER:staranaly}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 85MB

poster:
  api-key: ${POSTER_API_KEY:}
  base-url: ${POSTER_API_BASE_URL:}
  model: ${POSTER_MODEL:qwen-image-3.0-pro}
  daily-image-limit: ${POSTER_DAILY_IMAGE_LIMIT:40}

staranaly:
  model:
    base-url: ${MODEL_BASE_URL:https://api.deepseek.com}
    api-key: ${MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
    name: ${MODEL_NAME:deepseek-flash}
